sonar.organization=alejogarciabosio
sonar.projectKey=alejogarciabosio_transito-frontend
sonar.projectName=transito-frontend
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src/test,e2e
sonar.exclusions=src/test/**
sonar.sourceEncoding=UTF-8

# Cobertura desde Vitest (npm run test:coverage -> coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/test/**,e2e/**,**/*.test.js,**/*.test.jsx,src/main.jsx,*.config.js,scripts/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
